services:
  app:
    build: .
    container_name: personal_ai_app
    restart: unless-stopped
    env_file: .env
    environment:
      # SQLite in a volume by default. To use Postgres instead: `docker compose --profile postgres up`
      # and set COMPOSE_DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/personal_ai in .env
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-sqlite+aiosqlite:////data/assistant.db}
    ports:
      - "8000:8000"
    volumes:
      - assistant_data:/data

  postgres:
    profiles: ["postgres"]
    image: postgres:16
    container_name: personal_ai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: personal_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  assistant_data:
  postgres_data:
