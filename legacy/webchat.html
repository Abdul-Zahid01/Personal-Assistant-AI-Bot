<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personal AI Assistant</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --bubble-user: #2563eb;
        --bubble-assistant: #1f2937;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --border: #374151;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #0f172a, #111827);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .chat-shell {
        width: min(900px, 92vw);
        height: min(760px, 90vh);
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid var(--border);
        border-radius: 18px;
        box-shadow: 0 24px 80px rgba(0,0,0,0.35);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .header {
        padding: 18px 20px;
        border-bottom: 1px solid var(--border);
        background: rgba(15, 23, 42, 0.95);
      }

      .header h1 {
        margin: 0;
        font-size: 1.2rem;
      }

      .header .sub {
        margin-top: 6px;
        font-size: 0.9rem;
        color: var(--muted);
      }

      .quick-actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        padding: 12px 20px;
        border-bottom: 1px solid var(--border);
        background: rgba(17, 24, 39, 0.75);
      }

      .quick-btn {
        background: #1d4ed8;
        padding: 8px 12px;
        border-radius: 8px;
        font-size: 0.85rem;
      }

      .toggle-wrap {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 0.85rem;
        color: var(--muted);
      }

      .messages {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .message {
        max-width: 75%;
        padding: 12px 14px;
        border-radius: 14px;
        line-height: 1.4;
        white-space: pre-wrap;
      }

      .message.user {
        align-self: flex-end;
        background: var(--bubble-user);
      }

      .message.assistant {
        align-self: flex-start;
        background: var(--bubble-assistant);
        border: 1px solid var(--border);
      }

      .message.calendar {
        align-self: stretch;
        max-width: 100%;
        background: linear-gradient(160deg, #0b1220, #111827);
        border: 1px solid #334155;
      }

      .calendar-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-bottom: 12px;
      }

      .calendar-title {
        font-size: 0.95rem;
        font-weight: 700;
      }

      .calendar-link {
        background: #0ea5e9;
        color: #042f2e;
        text-decoration: none;
        padding: 6px 10px;
        border-radius: 8px;
        font-size: 0.8rem;
        font-weight: 700;
      }

      .calendar-grid {
        display: grid;
        gap: 8px;
      }

      .calendar-row {
        display: grid;
        grid-template-columns: 100px 1fr;
        gap: 10px;
        padding: 10px;
        border-radius: 10px;
        border: 1px solid #253042;
        background: rgba(15, 23, 42, 0.75);
      }

      .calendar-time {
        color: #7dd3fc;
        font-weight: 700;
        font-size: 0.85rem;
        align-self: center;
      }

      .calendar-task {
        font-size: 0.9rem;
      }

      .calendar-priority {
        margin-top: 4px;
        color: var(--muted);
        font-size: 0.8rem;
      }

      .calendar-badge {
        margin-left: 8px;
        display: inline-block;
        background: #334155;
        color: #cbd5e1;
        border-radius: 999px;
        padding: 2px 8px;
        font-size: 0.72rem;
      }

      .calendar-note {
        margin-top: 10px;
        color: var(--muted);
        font-size: 0.8rem;
      }

      .meta {
        margin-top: 6px;
        color: var(--muted);
        font-size: 0.78rem;
      }

      .composer {
        display: flex;
        gap: 12px;
        padding: 16px 20px 20px;
        border-top: 1px solid var(--border);
        background: rgba(15, 23, 42, 0.95);
      }

      input {
        flex: 1;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: #0b1220;
        color: var(--text);
        padding: 12px 14px;
        font-size: 1rem;
      }

      button {
        border: none;
        border-radius: 10px;
        background: #2563eb;
        color: white;
        padding: 12px 16px;
        font-weight: 600;
        cursor: pointer;
      }

      button:hover { opacity: 0.95; }
      .muted { color: var(--muted); }
    </style>
  </head>
  <body>
    <div class="chat-shell">
      <div class="header">
        <h1>Personal AI Assistant</h1>
        <div class="sub">Task + reminder + calendar assistant</div>
      </div>

      <div class="quick-actions">
        <button class="quick-btn" data-message="give me tasks for today">Today Plan</button>
        <button class="quick-btn" data-message="done with it">Mark Latest Done</button>
        <button class="quick-btn" data-message="create a task to review priorities today at 7pm">Add 7PM Task</button>
        <label class="toggle-wrap">
          <input id="debugToggle" type="checkbox" />
          Show debug
        </label>
      </div>

      <div id="messages" class="messages">
        <div class="message assistant">Hi! I can help with tasks, rules, and scheduling. Try: “Create a task to finish the project brief in 45 minutes”</div>
      </div>

      <div class="composer">
        <input id="messageInput" type="text" placeholder="Type your message..." />
        <button id="sendBtn">Send</button>
      </div>
    </div>

    <script>
      const messageInput = document.getElementById('messageInput');
      const messages = document.getElementById('messages');
      const sendBtn = document.getElementById('sendBtn');
      const debugToggle = document.getElementById('debugToggle');
      const quickButtons = document.querySelectorAll('.quick-btn');

      function appendMessage(text, role, meta = null) {
        const div = document.createElement('div');
        div.className = `message ${role}`;
        div.textContent = text;

        if (meta) {
          const metaDiv = document.createElement('div');
          metaDiv.className = 'meta';
          metaDiv.textContent = meta;
          div.appendChild(metaDiv);
        }

        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
      }

      function appendTodayCalendar(schedulePayload) {
        const wrapper = document.createElement('div');
        wrapper.className = 'message assistant calendar';

        const rows = Array.isArray(schedulePayload.schedule_table) ? schedulePayload.schedule_table : [];
        const hasTasks = rows.length > 0 && rows[0].task !== 'No task scheduled';

        const dedupedRows = [];
        if (hasTasks) {
          const grouped = new Map();
          rows.forEach((item) => {
            const time = (item.time_window || 'Flexible').trim();
            const task = (item.task || 'Untitled task').trim();
            const priority = (item.priority || 'P3').trim();
            const notes = (item.notes || '').trim();
            const key = `${time.toLowerCase()}|${task.toLowerCase()}`;

            if (!grouped.has(key)) {
              grouped.set(key, { time, task, priority, notes, count: 1 });
            } else {
              grouped.get(key).count += 1;
            }
          });
          dedupedRows.push(...Array.from(grouped.values()));
        }

        const head = document.createElement('div');
        head.className = 'calendar-head';

        const title = document.createElement('div');
        title.className = 'calendar-title';
        title.textContent = hasTasks ? 'Today Calendar View' : 'Today Calendar View (No tasks)';
        head.appendChild(title);

        const link = document.createElement('a');
        link.className = 'calendar-link';
        link.href = 'https://calendar.google.com/calendar/u/0/r/day';
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.textContent = 'Open Google Calendar';
        head.appendChild(link);

        wrapper.appendChild(head);

        const grid = document.createElement('div');
        grid.className = 'calendar-grid';

        if (!hasTasks) {
          const empty = document.createElement('div');
          empty.className = 'calendar-row';
          empty.innerHTML = '<div class="calendar-time">Today</div><div class="calendar-task">No scheduled tasks for today yet.</div>';
          grid.appendChild(empty);
        } else {
          const visibleRows = dedupedRows.slice(0, 8);
          visibleRows.forEach((item) => {
            const row = document.createElement('div');
            row.className = 'calendar-row';

            const time = document.createElement('div');
            time.className = 'calendar-time';
            time.textContent = item.time_window || 'Flexible';

            const taskWrap = document.createElement('div');
            const taskText = document.createElement('div');
            taskText.className = 'calendar-task';
            taskText.textContent = item.task || 'Untitled task';
            if (item.count > 1) {
              const badge = document.createElement('span');
              badge.className = 'calendar-badge';
              badge.textContent = `x${item.count}`;
              taskText.appendChild(badge);
            }

            const pri = document.createElement('div');
            pri.className = 'calendar-priority';
            pri.textContent = `Priority: ${item.priority || 'P3'}${item.notes ? ` | ${item.notes}` : ''}`;

            taskWrap.appendChild(taskText);
            taskWrap.appendChild(pri);

            row.appendChild(time);
            row.appendChild(taskWrap);
            grid.appendChild(row);
          });

          if (dedupedRows.length > 8) {
            const note = document.createElement('div');
            note.className = 'calendar-note';
            note.textContent = `Showing 8 of ${dedupedRows.length} tasks. Ask "cleanup duplicates" for a cleaner list.`;
            grid.appendChild(note);
          }
        }

        wrapper.appendChild(grid);
        messages.appendChild(wrapper);
        messages.scrollTop = messages.scrollHeight;
      }

      async function fetchAndRenderTodayCalendar() {
        const response = await fetch('http://localhost:8000/api/v1/schedule/today');
        const payload = await response.json();
        appendTodayCalendar(payload);
      }

      async function sendMessage(prefillText) {
        const text = (prefillText || messageInput.value).trim();
        if (!text) return;

        appendMessage(text, 'user');
        messageInput.value = '';

        try {
          const response = await fetch('http://localhost:8000/api/v1/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: text })
          });

          const data = await response.json();
          let meta = null;
          if (debugToggle.checked) {
            const intent = data.intent || 'unknown';
            const parserUsed = data.parser_used || 'none';
            meta = `intent=${intent} | parser=${parserUsed}`;
          }
          appendMessage(data.reply || 'No reply returned.', 'assistant', meta);

          const normalizedText = text.toLowerCase();
          if (
            data.intent === 'GET_TODAY_SCHEDULE' ||
            normalizedText.includes('tasks for today') ||
            normalizedText.includes('today plan') ||
            normalizedText.includes('give me tasks')
          ) {
            await fetchAndRenderTodayCalendar();
          }
        } catch (error) {
          appendMessage('The assistant is unavailable right now. Make sure the backend is running on localhost:8000.', 'assistant');
        }
      }

      sendBtn.addEventListener('click', () => sendMessage());
      messageInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') sendMessage();
      });

      quickButtons.forEach((btn) => {
        btn.addEventListener('click', () => {
          sendMessage(btn.dataset.message || '');
        });
      });
    </script>
  </body>
</html>
